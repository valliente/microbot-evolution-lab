name: Publish Release - 0.1.202

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Production & Standalone Bundles
        run: |
          npm run build
          npm run build:package
          npm run build:exe

      - name: Create Portable Zip Package
        run: |
          Compress-Archive -Path "PLAY.bat", "MicrobotEvolutionLab.hta", "dist-standalone\index.html", "README.md", "LICENSE" -DestinationPath "Microbot-Evolution-Lab-Windows.zip" -Force

      - name: Publish GitHub Full Release
        uses: softprops/action-gh-release@v1
        with:
          name: "0.1.202"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🔮 Microbot Evolution Lab - 0.1.202 Spatial Performance & Blueprint Studio Release
            
            ### 🌟 Key Feature Additions:
            - **Quadtree Spatial Partitioning**: Optimized entity collision detection and sensory range queries via dynamic recursive Quadtree nodes ($O(N \log N)$ performance).
            - **FPS Target Switcher**: Select between 30 FPS, 60 FPS, 120 FPS, or Uncapped rendering directly from the top navigation deck.
            - **Blueprint Studio & Gene Splicing**: Interactive strain designer modal allowing users to craft custom microbot blueprints with custom speeds, vision, efficiency, and color pigments.
            - **Spatial Heatmap Overlays**: Color-coded spatial canvas layers for **Mortality (Red)**, **Food Density (Green)**, and **Traffic Pathing (Blue)**.
            - **Extinction Crisis Alert Banner**: Real-time canvas alert banner warning when active microbot population drops below critical survival threshold (< 15 bots).
            - **Standalone Windows Executable**: Bundled with native `MicrobotEvolutionLab.exe` compiled for Windows.
          draft: false
          prerelease: false
          files: |
            MicrobotEvolutionLab.exe
            MicrobotEvolutionLab.hta
            PLAY.bat
            Microbot-Evolution-Lab-Windows.zip
            dist-standalone/index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
