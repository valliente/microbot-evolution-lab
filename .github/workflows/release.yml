name: Publish Release - 0.1.204

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Production & Standalone Bundles
        run: |
          npm run build
          npm run build:package
          npm run build:exe

      - name: Create Portable Zip Package
        run: |
          Compress-Archive -Path "PLAY.bat", "MicrobotEvolutionLab.hta", "dist-standalone\index.html", "README.md", "LICENSE" -DestinationPath "Microbot-Evolution-Lab-Windows.zip" -Force

      - name: Publish GitHub Full Release
        uses: softprops/action-gh-release@v1
        with:
          name: "0.1.204"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🔮 Microbot Evolution Lab - 0.1.204 High-Performance Engine Overhaul Release
            
            ### 🌟 Key Feature Additions & Performance Overhaul:
            - **Spatial Hash Grid Partitioning**: Dynamic $O(1)$ grid lookup system replacing brute-force spatial loops.
            - **Zero-Allocation Object Pools**: Memory recycling architecture for food particles, raycasts, and hazard entities.
            - **Web Worker Multi-Threading**: Offloaded DNA crossover, mutation, and spatial collision distance calculations to background threads.
            - **Kinetic Physics Engine**: Mass inertia, velocity drag friction ($0.96$), and elastic momentum bouncing between colliding microbots.
            - **Web Audio API Synth Engine**: Procedural soundscapes for particle feeding, collisions, and ambient energy frequency modulation.
            - **Performance Diagnostics Overlay**: Real-time FPS counter, entity allocation stats, and thread load telemetry.
            - **Fluid Resistance Zones**: Interactive spatial water currents and viscous hazard field rendering.
            - **Tab Visibility State Recovery**: Automated engine state recovery preventing canvas freezes on background tab switches.
            - **Standalone Executable**: Bundled with native `MicrobotEvolutionLab.exe` compiled for Windows.
          draft: false
          prerelease: false
          files: |
            MicrobotEvolutionLab.exe
            MicrobotEvolutionLab.hta
            PLAY.bat
            Microbot-Evolution-Lab-Windows.zip
            dist-standalone/index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
