name: Publish Release - 0.1.226

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Production & Standalone Bundles
        run: |
          npm run build
          npm run build:package
          npm run build:exe

      - name: Create Portable Zip Package
        run: |
          Compress-Archive -Path "PLAY.bat", "MicrobotEvolutionLab.hta", "dist-standalone\index.html", "README.md", "LICENSE" -DestinationPath "Microbot-Evolution-Lab-Windows.zip" -Force

      - name: Build Android APK
        run: |
          npx cap sync android
          cd android
          .\gradlew assembleDebug
          cd ..
          Copy-Item "android\app\build\outputs\apk\debug\app-debug.apk" -Destination "MicrobotEvolutionLab.apk" -Force

      - name: Generate Checksums
        run: |
          # Generate SHA-256 checksums for release asset verification (v0.1.226)
          Get-FileHash -Path MicrobotEvolutionLab.exe -Algorithm SHA256 > checksums.txt
          Get-FileHash -Path MicrobotEvolutionLab.apk -Algorithm SHA256 >> checksums.txt
          Get-FileHash -Path Microbot-Evolution-Lab-Windows.zip -Algorithm SHA256 >> checksums.txt

      - name: Confirm Build Assets
        run: |
          Write-Output "Compiled MicrobotEvolutionLab.exe (v0.1.225) successfully"
          Write-Output "Compiled MicrobotEvolutionLab.apk (v0.1.225) successfully"
          Write-Output "Zip bundle, HTA, and checksums generated"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.226
          name: "Microbot Evolution Lab v0.1.226"
          body: |
            Microbot Evolution Lab v0.1.226
            - WASM SIMD Spatial Hashing & ArrayBuffer Transfer Pipeline
            - Dynamic Phenotype Structural Morphing (Armor, Fins, Lure Shaders)
            - Autonomous Sandbox Harness for 1,000-Generation Runs
            - Phenotype Structural Inspector Modal
            - WASM Memory & Spatial Hash Telemetry
          draft: false
          prerelease: false
          # Attach BOTH desktop EXE and Android APK binaries for release v0.1.226
          files: |
            MicrobotEvolutionLab.exe
            MicrobotEvolutionLab.apk
            MicrobotEvolutionLab.hta
            PLAY.bat
            Microbot-Evolution-Lab-Windows.zip
            dist-standalone/index.html
            checksums.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Build Artifacts
        run: |
          # Purge temporary build artifacts from GitHub Actions runner workspace
          Remove-Item -Path "MicrobotEvolutionLab.exe" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "MicrobotEvolutionLab.apk" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "Microbot-Evolution-Lab-Windows.zip" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "checksums.txt" -Force -ErrorAction SilentlyContinue
