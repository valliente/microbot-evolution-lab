name: Publish Release - 0.1.203

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Production & Standalone Bundles
        run: |
          npm run build
          npm run build:package
          npm run build:exe

      - name: Create Portable Zip Package
        run: |
          Compress-Archive -Path "PLAY.bat", "MicrobotEvolutionLab.hta", "dist-standalone\index.html", "README.md", "LICENSE" -DestinationPath "Microbot-Evolution-Lab-Windows.zip" -Force

      - name: Publish GitHub Full Release
        uses: softprops/action-gh-release@v1
        with:
          name: "0.1.203"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🔮 Microbot Evolution Lab - 0.1.203 Chaos Engine & Multi-Lab Telemetry Release
            
            ### 🌟 Key Feature Additions:
            - **Catastrophe Engine**: Invoke localized Meteor Strikes (blast vaporization) and Gravitational Void Rifts (area-of-effect pull forces).
            - **Pathogen Transmission & Immunity**: Collision-based viral outbreak contagion mechanics with antibody immunity mutation over time.
            - **Dual-Canvas Parallel Split Mode**: Compare population telemetry side-by-side in real-time split view.
            - **Base64 Genetic Blueprint Exporter**: Copy encoded DNA strings to clipboard and import/clone custom microbot strains.
            - **Automated Batch Experiment Runner**: Accelerate evolution calculations up to 10x speed to simulate $N$ generations and export summary reports.
            - **Extinction Prediction AI**: Calculate real-time Shannon Diversity Index ($H$) with automated low-diversity alerts.
            - **Automated Unit Test Suite**: Includes automated unit testing for spatial lookups, collision bounds, and pathogen mechanics.
            - **Standalone Windows Executable**: Bundled with native `MicrobotEvolutionLab.exe` compiled for Windows.
          draft: false
          prerelease: false
          files: |
            MicrobotEvolutionLab.exe
            MicrobotEvolutionLab.hta
            PLAY.bat
            Microbot-Evolution-Lab-Windows.zip
            dist-standalone/index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
