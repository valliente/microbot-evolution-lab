name: Publish Release - 0.1.211

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Production & Standalone Bundles
        run: |
          npm run build
          npm run build:package
          npm run build:exe

      - name: Create Portable Zip Package
        run: |
          Compress-Archive -Path "PLAY.bat", "MicrobotEvolutionLab.hta", "dist-standalone\index.html", "README.md", "LICENSE" -DestinationPath "Microbot-Evolution-Lab-Windows.zip" -Force

      - name: Generate Checksums
        run: |
          Get-FileHash -Path MicrobotEvolutionLab.exe -Algorithm SHA256 > checksums.txt
          Get-FileHash -Path Microbot-Evolution-Lab-Windows.zip -Algorithm SHA256 >> checksums.txt

      - name: Purge old releases and tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch all release tags and delete them to keep only the newest one
          $releases = gh api repos/${{ github.repository }}/releases -q '.[].tag_name'
          foreach ($r in $releases) {
            if ($r -ne "${{ github.ref_name }}") {
              Write-Output "Deleting release and tag: $r"
              gh release delete $r -y --cleanup-tag
              git push --delete origin $r
            }
          }

      - name: Publish GitHub Full Release
        uses: softprops/action-gh-release@v1
        with:
          name: "0.1.211"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🧬 Microbot Evolution Lab - 0.1.211 Performance Release

            ### 🚀 Highlights
            - Quantum Genetic Engine
            - Radiation Storm & Magnetic Inversion Disasters
            - SharedArrayBuffer Threading Overhaul
            - Dynamic JSON/CSV Export
          draft: false
          prerelease: false
          files: |
            MicrobotEvolutionLab.exe
            MicrobotEvolutionLab.hta
            PLAY.bat
            Microbot-Evolution-Lab-Windows.zip
            dist-standalone/index.html
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
