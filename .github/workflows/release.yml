name: Publish Release - 0.1.206

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Production & Standalone Bundles
        run: |
          npm run build
          npm run build:package
          npm run build:exe

      - name: Create Portable Zip Package
        run: |
          Compress-Archive -Path "PLAY.bat", "MicrobotEvolutionLab.hta", "dist-standalone\index.html", "README.md", "LICENSE" -DestinationPath "Microbot-Evolution-Lab-Windows.zip" -Force

      - name: Publish GitHub Full Release
        uses: softprops/action-gh-release@v1
        with:
          name: "0.1.206"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🔧 Microbot Evolution Lab - 0.1.206 Audio Fix & UI Polish Release

            ### 🔇 Critical Audio Bug Fix
            - Fixed corrupted oscillator loops causing weird pitch/buzzing noises
            - Audio engine now starts **muted by default** — no surprise noises on launch
            - Added master volume slider and quick mute toggle in the header toolbar
            - Rate-limited oscillator spawns (80ms cooldown), capped at 4 concurrent, clamped to 220–880 Hz

            ### ⚡ Performance Optimizations
            - Cached background grid to offscreen canvas layer (only redraws on resize)
            - Expanded object pools: trail points, food particles, and raycasts
            - Quadtree depth guard prevents runaway subdivision on population spikes
            - React.memo + useMemo on sidebar charts to eliminate redundant redraws

            ### 🎨 UI Polish
            - Sharper glassmorphism contrast with hover glow transitions
            - Smooth accordion animations on collapsible parameter sections
            - Fading bioluminescent movement trails with directional heading vectors
          draft: false
          prerelease: false
          files: |
            MicrobotEvolutionLab.exe
            MicrobotEvolutionLab.hta
            PLAY.bat
            Microbot-Evolution-Lab-Windows.zip
            dist-standalone/index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
