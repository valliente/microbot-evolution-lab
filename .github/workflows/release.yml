name: Publish Release - 0.1.201

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Production & Standalone Bundles
        run: |
          npm run build
          npm run build:package
          npm run build:exe

      - name: Create Portable Zip Package
        run: |
          Compress-Archive -Path "PLAY.bat", "MicrobotEvolutionLab.hta", "dist-standalone\index.html", "README.md", "LICENSE" -DestinationPath "Microbot-Evolution-Lab-Windows.zip" -Force

      - name: Publish GitHub Full Release
        uses: softprops/action-gh-release@v1
        with:
          name: "0.1.201"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🔮 Microbot Evolution Lab - 0.1.201 Ecosystem & AI Dynamics Engine Release
            
            ### 🌟 Key Feature Additions:
            - **Seasonal & Resource Cycles**: Dynamic seasonal transitions (Spring 🌸, Summer ☀️, Autumn 🍂, Winter ❄️) with resource spawn rate modifiers and battery drain fluctuations.
            - **Multi-Type Energy Particles**: Nutrient Dots (Green), Super Chargers (Cyan +50 Energy), and Mutagen Orbs (Magenta +Instant Mutation).
            - **Pheromone Trails & Sensory Pathfinding**: Decaying glowing pheromone trails deposited by microbots as they travel across the simulation canvas.
            - **Predator & Carnivorous Microbot AI**: High-speed, high-efficiency microbots evolve aggressive predator traits (crimson red claws) to hunt and harvest energy from other microbots.
            - **Genetic Drift Heatmap Analytics**: Visual trait distribution heatmap drawer rendering Speed, Vision, and Efficiency drift over time.
            - **Standalone Windows Executable**: Bundled with native `MicrobotEvolutionLab.exe` compiled for Windows.
          draft: false
          prerelease: false
          files: |
            MicrobotEvolutionLab.exe
            MicrobotEvolutionLab.hta
            PLAY.bat
            Microbot-Evolution-Lab-Windows.zip
            dist-standalone/index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
