name: Publish Release - Beta 0.1.2

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Production & Standalone Bundles
        run: |
          npm run build
          npm run build:package
          npm run build:exe

      - name: Create Portable Zip Package
        run: |
          Compress-Archive -Path "PLAY.bat", "MicrobotEvolutionLab.hta", "dist-standalone\index.html", "README.md", "LICENSE" -DestinationPath "Microbot-Evolution-Lab-Windows.zip" -Force

      - name: Publish GitHub Full Release
        uses: softprops/action-gh-release@v1
        with:
          name: "Beta 0.1.2"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🔮 Microbot Evolution Lab - Beta 0.1.2 Feature Pack Release
            
            ### 🌟 Key Feature Additions:
            - **Gene Inspector & Interactive DNA Panel**: Real-time genetic attribute overrides (Speed, Vision Radius, Efficiency, Hue) directly from the Bot Data Hub.
            - **Lineage Tree Modal**: Collapsible visual family tree tracking parents, active microbots, and offspring across generations.
            - **Environmental Weather Engine**: Dynamic global weather events including Solar Flares (+2.5x Battery Drain), Toxic Drift (Moving Hazards), and Resource Blooms.
            - **Canvas Painting Brush Tool**: Paint custom Food Clusters, Hazard Zones, and Speed Boost Fields directly onto the simulation grid.
            - **Sensory LIDAR Raycasting**: Multi-angle sensory ray lines protruding from microbots with color-coded detection of resources (Green) and hazards (Orange).
            - **Telemetry & Preset Exporters**: Export simulation history to CSV telemetry logs and save/load custom JSON preset configurations.
          draft: false
          prerelease: false
          files: |
            MicrobotEvolutionLab.exe
            MicrobotEvolutionLab.hta
            PLAY.bat
            Microbot-Evolution-Lab-Windows.zip
            dist-standalone/index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
