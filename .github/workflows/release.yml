name: Publish Release - 0.1.205

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Production & Standalone Bundles
        run: |
          npm run build
          npm run build:package
          npm run build:exe

      - name: Create Portable Zip Package
        run: |
          Compress-Archive -Path "PLAY.bat", "MicrobotEvolutionLab.hta", "dist-standalone\index.html", "README.md", "LICENSE" -DestinationPath "Microbot-Evolution-Lab-Windows.zip" -Force

      - name: Publish GitHub Full Release
        uses: softprops/action-gh-release@v1
        with:
          name: "0.1.205"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🔮 Microbot Evolution Lab - 0.1.205 Finale Web Worker & Epigenetics Release
            
            ### 🌟 Key Feature Additions:
            - **Web Worker Multi-Threading**: Offloaded Quadtree physics calculations, DNA crossover/mutation, and spatial collision distance checks to background worker threads.
            - **Epigenetic Engine**: Starvation and hazard exposure accumulate epigenetic stress triggering adaptive trait expression.
            - **Symbiosis & Parasitism Mechanics**: Non-predator microbots form symbiotic energy-sharing pairs; parasitic entities siphon host energy on contact.
            - **3D Genetic Constellation Map**: Interactive rotating 3D species clustering map with one-click PNG snapshot export.
            - **Performance Diagnostics Overlay**: Real-time FPS, entity counters, and memory object pool telemetry.
            - **Standalone Executable**: Bundled with native `MicrobotEvolutionLab.exe` compiled for Windows.
          draft: false
          prerelease: false
          files: |
            MicrobotEvolutionLab.exe
            MicrobotEvolutionLab.hta
            PLAY.bat
            Microbot-Evolution-Lab-Windows.zip
            dist-standalone/index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
